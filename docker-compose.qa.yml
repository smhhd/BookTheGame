services:
  postgres:
    ports: !override ["15432:5432"]

  redis:
    ports: !override ["16379:6379"]

  elasticsearch:
    ports: !override ["19200:9200"]

  backend:
    environment:
      JWT_SECRET: qa-only-jwt-secret-at-least-32-characters
      OTP_HASH_SECRET: qa-only-otp-secret-at-least-32-characters
      CORS_ORIGIN: http://localhost:15173
      SEARCH_RATE_LIMIT_MAX: 40
      RESERVATION_RATE_LIMIT_MAX: 40
      PAYMENT_RATE_LIMIT_MAX: 20
    ports: !override ["13000:3000"]

  search-indexer:
    environment:
      JWT_SECRET: qa-only-jwt-secret-at-least-32-characters
      OTP_HASH_SECRET: qa-only-otp-secret-at-least-32-characters

  frontend:
    build:
      args:
        VITE_API_BASE_URL: http://localhost:13000
    ports: !override ["15173:80"]
